name: Workbench platform checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: false
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: checks-${{ inputs.ref || github.ref }}
  cancel-in-progress: true
jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Repository hygiene
        run: python scripts/check_repo.py
      - name: Release metadata
        run: python scripts/check.py --metadata
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install linters
        run: |
          python -m pip install --disable-pip-version-check ruff==0.17.3
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
      - name: Python lint
        run: ruff check --select E9,F63,F7,F82,F821 workbench scripts tests
      - name: Bash lint
        run: shellcheck -S warning -e SC1111 -x $(git ls-files '*.sh')
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: Python syntax
        run: python -m compileall -q workbench scripts tests
      - name: Dashboard JavaScript syntax
        shell: bash
        run: for file in panel/*.js; do node --check "$file"; done
      - name: Bash entry points
        if: runner.os != 'Windows'
        run: bash -n scripts/install-host.sh setup.sh start.sh panel.sh scripts/legacy/setup.sh scripts/legacy/start.sh
      - name: Windows starter syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($file in @('Start-wsc-local.ps1','Install-wsc-local.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | Format-List; exit 1 }
          }
          ./Install-wsc-local.ps1 -DryRun
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Real dashboard update and browser reconnection
        env:
          WSC_UPDATE_BROWSER_TEST: '1'
        run: python -m unittest discover -s tests -p test_update_restart.py -v
