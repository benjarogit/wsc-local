name: Publish release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag, for example v1.2.0
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.ref.outputs.commit }}
    steps:
      - name: Validate stable tag before checkout
        env:
          WSC_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python -c "import os,re; assert re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', os.environ['WSC_RELEASE_TAG']), 'Expected vMAJOR.MINOR.PATCH'"
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - id: ref
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  checks:
    needs: resolve
    uses: ./.github/workflows/workbench.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}
  publish:
    needs: [resolve, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate version, build verified archive and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WSC_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python scripts/release.py --tag "$WSC_RELEASE_TAG" --publish
