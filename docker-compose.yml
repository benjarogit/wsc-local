name: ${COMPOSE_PROJECT_NAME:-wsc-local}

services:
  webserver:
    build: .
    container_name: ${NAME_PREFIX:-woltlab}-web
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
      - "127.0.0.1:${HTTPS_PORT:-443}:443"
    volumes:
      - ./woltlab:/var/www/html
      - ./config/php.ini:/usr/local/etc/php/php.ini:ro
      - ./config/000-https.conf:/etc/apache2/sites-available/000-default.conf:ro
      - ./certs/fullchain.pem:/etc/ssl/certs/fullchain.pem:ro
      - ./certs/privkey.pem:/etc/ssl/private/privkey.pem:ro
    depends_on:
      database:
        condition: service_healthy
    networks:
      - wsc-net
    environment:
      APACHE_DOCUMENT_ROOT: /var/www/html
      WCFSETUP_DBHOST: database
      WCFSETUP_DBUSER: ${MYSQL_USER:-admin}
      WCFSETUP_DBPASSWORD: ${MYSQL_PASSWORD}
      WCFSETUP_DBNAME: ${MYSQL_DATABASE:-woltlab}

  database:
    image: mysql:8.0.46
    container_name: ${NAME_PREFIX:-woltlab}-mysql
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - ${LEGACY_DB_PATH:-mysql-data}:/var/lib/mysql
    networks:
      - wsc-net
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-woltlab}
      MYSQL_USER: ${MYSQL_USER:-admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 25s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin@sha256:42a200db07b4e70fbf32c594ad4521cf16399b8e54bbb5adceae98e7566dfbeb
    container_name: ${NAME_PREFIX:-woltlab}-phpmyadmin
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8081}:80"
    networks:
      - wsc-net
    environment:
      PMA_HOST: database
      PMA_USER: ${MYSQL_USER:-admin}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      database:
        condition: service_healthy

  mailhog:
    image: mailhog/mailhog@sha256:8d76a3d4ffa32a3661311944007a415332c4bb855657f4f6c57996405c009bea
    container_name: ${NAME_PREFIX:-woltlab}-mailhog
    ports:
      - "127.0.0.1:${MAILHOG_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILHOG_SMTP_PORT:-1025}:1025"
    networks:
      - wsc-net

networks:
  wsc-net:
    name: ${COMPOSE_PROJECT_NAME:-wsc-local}_net
    driver: bridge

volumes:
  mysql-data:
